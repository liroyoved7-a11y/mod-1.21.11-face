name: Build LIROY FreeCam

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LIROY-FreeCam-1.21.11/LIROY-FreeCam

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew build
    - name: Upload JAR
      uses: actions/upload-artifact@v4
      with:
        name: LIROY-FreeCam-JAR
        path: LIROY-FreeCam-1.21.11/LIROY-FreeCam/build/libs/*.jar
